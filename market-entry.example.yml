# ---------------------------------------------------------------------------
# DSH 插件市场条目模板
#
# 提交位置： awesome-dsh-plugin/awesome-dsh-plugin
#            仓库 → data/plugins/Ygritteee__<仓库名>.yml
# 规则：     一个插件一个文件；一个 PR 最多 3 条；不要手改生成的 README。
# 文档：     https://github.com/awesome-dsh-plugin/awesome-dsh-plugin/blob/main/contributing.md
#
# 把下面占位符换成你自己的信息，再删掉这段注释也可以（保留注释不影响解析）。
# ---------------------------------------------------------------------------

# 必须与 GitHub 仓库地址完全一致
url: https://github.com/Ygritteee/dsh-ygritte-boot

# 列表中显示的链接文字，用 owner/repo
name: Ygritteee/dsh-ygritte-boot

# 分类：本插件是开机片头 + 身份授权界面 → ui
# 纯主题/皮肤才用 theme
category: ui

description:
  # 必填。只写功能、不要营销词；含 ": " 必须用引号；以句号结尾
  en: 'Full-screen ice-and-fire boot intro for DSH: a frost-to-ember boot sequence with typed bilingual logs and a hairline progress line, then Ygritte''s five-step identity authorization. Esc skips, Enter or click fast-forwards, and a settings page switches it off/quick/full or replays it; the host half paints the opening frame while the document parses, so the built-in loading card never shows.'
  # 可选；不写的话维护者会补
  zh: '给 DSH 加一段「冰与火」全屏开机片头：冰霜→余烬的启动动画、双语打字机日志与发丝进度线，随后是 Ygritte 的五步身份授权。Esc 跳过，Enter/点击快进，设置页可切换关闭/简易/完整或随时重播；首帧由宿主半边在文档解析阶段就注入，DSH 自带的 Loading 卡片不会露脸。'

# 可选：市场卡片图标，必须是 GitHub 托管的位图（png/jpg/webp），约 96px 方形最佳；SVG 会被拒
# icon: https://raw.githubusercontent.com/Ygritteee/dsh-ygritte-boot/main/assets/icon-180.png

# 可选：不发 npm 时，用 GitHub Release 上的预构建 tgz（必须 https + GitHub 自己的 release 域名）
# 注意用带 tag 的固定 URL，不要用 latest/download/ + 带版本号的 asset 名
# tarball: https://github.com/Ygritteee/dsh-ygritte-boot/releases/download/v1.3.0/dsh-ygritte-boot-1.3.0.tgz
